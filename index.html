<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Coletor de Lote</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background-color: #000; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    #app {
      display: flex; flex-direction: column;
      height: 100dvh; width: 100%; position: relative;
    }
    #header {
      padding: 10px 14px; background: rgba(20, 20, 20, 0.95);
      display: flex; justify-content: space-between; align-items: center;
      font-size: 13px; z-index: 10; border-bottom: 1px solid #333;
    }
    .badge {
      background: #2e7d32; padding: 4px 8px; border-radius: 4px; font-weight: bold;
    }
    .btn-reset {
      background: transparent; border: 1px solid #666; color: #aaa;
      padding: 3px 6px; border-radius: 4px; font-size: 11px;
    }
    #status-bar {
      font-size: 11px; color: #ffeb3b; text-align: center; background: #1a1a1a; padding: 5px 8px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #camera-container {
      flex: 1; position: relative; background: #000;
      overflow: hidden; display: flex; align-items: center; justify-content: center;
    }
    video {
      width: 100%; height: 100%; object-fit: cover;
    }
    #controls {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
      background: #181818; gap: 12px; z-index: 10; border-top: 1px solid #2a2a2a;
    }
    .btn {
      flex: 1; min-height: 60px; border-radius: 12px; border: none;
      font-size: 15px; font-weight: bold; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      touch-action: manipulation;
    }
    .btn-photo { background: #0288d1; color: white; }
    .btn-photo:active { background: #0277bd; }
    .btn-next { background: #f57c00; color: white; }
    .btn-next:active { background: #e65100; }
    .subtext { font-size: 11px; margin-top: 3px; opacity: 0.85; font-weight: normal; }
    #flash {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: white; opacity: 0; pointer-events: none;
      transition: opacity 0.1s ease-out; z-index: 5;
    }
  </style>
</head>
<body>

  <div id="app">
    <div id="header">
      <div>Item: <span id="prod-label" class="badge">PROD_001</span></div>
      <div>Fotos: <span id="photo-count">0</span></div>
      <button class="btn-reset" id="btn-reset">Zerar</button>
    </div>
    <div id="status-bar">Iniciando câmera...</div>

    <div id="camera-container">
      <video id="video" autoplay playsinline webkit-playsinline muted></video>
      <div id="flash"></div>
      <canvas id="canvas" style="display:none;"></canvas>
    </div>

    <div id="controls">
      <button class="btn btn-photo" id="btn-photo">
        📷 FOTOGRAFAR (A)
        <span class="subtext">Salva no Drive</span>
      </button>

      <button class="btn btn-next" id="btn-next">
        ➡️ PRÓXIMO (B)
        <span class="subtext">Mudar Produto</span>
      </button>
    </div>
  </div>

  <script>
    // COLE SUA URL DO APPS SCRIPT AQUI (mantenha a que você já gerou)
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxYjjsSAyiQQZURU5RiOz0NN17392cq7exjUvg3OLObHehg8yOIRavZwRnpHmmdxvM4_A/exec";

    let currentProdIndex = parseInt(localStorage.getItem('savedProdIndex')) || 1;
    let currentPhotoIndex = parseInt(localStorage.getItem('savedPhotoIndex')) || 1;

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const flash = document.getElementById('flash');
    const prodLabel = document.getElementById('prod-label');
    const photoCountLabel = document.getElementById('photo-count');
    const statusBar = document.getElementById('status-bar');

    function updateDisplay() {
      prodLabel.innerText = 'PROD_' + String(currentProdIndex).padStart(3, '0');
      photoCountLabel.innerText = currentPhotoIndex - 1;
    }

    async function startCamera() {
      statusBar.innerText = "Solicitando permissão da câmera...";
      
      const constraintsList = [
        // Tentativa 1: Traseira padrão com resolução flexível
        { video: { facingMode: { ideal: "environment" } }, audio: false },
        // Tentativa 2: Traseira simples sem restrição
        { video: { facingMode: "environment" }, audio: false },
        // Tentativa 3: Qualquer câmera disponível
        { video: true, audio: false }
      ];

      let stream = null;
      for (const constraints of constraintsList) {
        try {
          stream = await navigator.mediaDevices.getUserMedia(constraints);
          if (stream) break;
        } catch (e) {
          console.warn("Tentativa de câmera falhou:", e);
        }
      }

      if (!stream) {
        statusBar.style.color = "#f44336";
        statusBar.innerText = "Erro: câmera bloqueada ou não encontrada. Verifique permissões.";
        return;
      }

      video.srcObject = stream;
      video.setAttribute("playsinline", "true");
      video.setAttribute("webkit-playsinline", "true");
      video.muted = true;

      video.onloadedmetadata = async () => {
        try {
          await video.play();
          statusBar.style.color = "#4caf50";
          statusBar.innerText = "Câmera pronta para fotos";
        } catch (err) {
          statusBar.style.color = "#f44336";
          statusBar.innerText = "Clique na tela para destravar a câmera";
          document.body.addEventListener('click', () => video.play(), { once: true });
        }
      };
    }

    function triggerFlash() {
      flash.style.opacity = '0.7';
      setTimeout(() => { flash.style.opacity = '0'; }, 100);
      if (navigator.vibrate) navigator.vibrate(40);
    }

    async function uploadImage(base64Data, prodId, filename) {
      statusBar.style.color = "#ffeb3b";
      statusBar.innerText = `Subindo ${filename}...`;

      if (!SCRIPT_URL || SCRIPT_URL.includes("SUA_URL_DO_APPS_SCRIPT_AQUI")) {
        statusBar.style.color = "#ff9800";
        statusBar.innerText = "Aviso: URL do Apps Script não configurada";
        return;
      }

      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({
            prodId: prodId,
            filename: filename,
            image: base64Data
          })
        });

        const resJson = await response.json();
        if (resJson.status === "ok") {
          statusBar.style.color = "#4caf50";
          statusBar.innerText = `Salvo no Drive: ${filename}`;
        } else {
          statusBar.style.color = "#f44336";
          statusBar.innerText = `Erro Drive: ${resJson.message}`;
        }
      } catch (e) {
        statusBar.style.color = "#f44336";
        statusBar.innerText = `Erro de rede ao subir ${filename}`;
      }
    }

    document.getElementById('btn-photo').addEventListener('click', () => {
      if (!video.videoWidth || !video.videoHeight) {
        alert("Aguarde a câmera iniciar totalmente.");
        return;
      }

      triggerFlash();

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const prodId = 'PROD_' + String(currentProdIndex).padStart(3, '0');
      const filename = `${prodId}_FOTO_${currentPhotoIndex}.jpg`;
      const base64 = canvas.toDataURL('image/jpeg', 0.85);

      uploadImage(base64, prodId, filename);

      currentPhotoIndex++;
      localStorage.setItem('savedPhotoIndex', currentPhotoIndex);
      updateDisplay();
    });

    document.getElementById('btn-next').addEventListener('click', () => {
      if (currentPhotoIndex === 1) {
        if (!confirm("Nenhuma foto deste item. Avançar mesmo assim?")) return;
      }

      currentProdIndex++;
      currentPhotoIndex = 1;

      localStorage.setItem('savedProdIndex', currentProdIndex);
      localStorage.setItem('savedPhotoIndex', currentPhotoIndex);

      updateDisplay();
      statusBar.style.color = "#fff";
      statusBar.innerText = `Pronto para PROD_${String(currentProdIndex).padStart(3, '0')}`;

      if (navigator.vibrate) navigator.vibrate([80, 50, 80]);
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
      if (confirm("Zerar e voltar ao PROD_001?")) {
        currentProdIndex = 1;
        currentPhotoIndex = 1;
        localStorage.removeItem('savedProdIndex');
        localStorage.removeItem('savedPhotoIndex');
        updateDisplay();
        statusBar.innerText = "Reiniciado para PROD_001";
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      updateDisplay();
      startCamera();
    });
  </script>
</body>
</html>
