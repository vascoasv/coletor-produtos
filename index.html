<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Coletor de Lote - v1.4</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%; height: 100%;
      background-color: #000; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }
    #app {
      display: flex; flex-direction: column;
      height: 100dvh; width: 100%; position: relative;
    }
    #header {
      padding: 10px 14px; background: rgba(20, 20, 20, 0.95);
      display: flex; justify-content: space-between; align-items: center;
      font-size: 13px; z-index: 10; border-bottom: 1px solid #333;
    }
    .badge {
      background: #2e7d32; padding: 4px 8px; border-radius: 4px; font-weight: bold;
    }
    .version-tag {
      font-size: 10px; color: #888; background: #222; border: 1px solid #444;
      padding: 2px 6px; border-radius: 4px;
    }
    .btn-reset {
      background: transparent; border: 1px solid #666; color: #aaa;
      padding: 3px 6px; border-radius: 4px; font-size: 11px;
    }
    #status-bar {
      font-size: 11px; color: #ffeb3b; text-align: center; background: #1a1a1a; padding: 5px 8px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #camera-container {
      flex: 1; position: relative; background: #000;
      overflow: hidden; display: flex; align-items: center; justify-content: center;
    }
    video { width: 100%; height: 100%; object-fit: cover; }
    #controls {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 12px calc(12px + env(safe-area-inset-bottom));
      background: #181818; gap: 12px; z-index: 10; border-top: 1px solid #2a2a2a;
    }
    .btn {
      flex: 1; min-height: 60px; border-radius: 12px; border: none;
      font-size: 15px; font-weight: bold; cursor: pointer;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      touch-action: manipulation;
    }
    .btn-photo { background: #0288d1; color: white; }
    .btn-photo:active { background: #0277bd; }
    .btn-next { background: #f57c00; color: white; }
    .btn-next:active { background: #e65100; }
    .subtext { font-size: 11px; margin-top: 3px; opacity: 0.85; font-weight: normal; }
    #flash {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: white; opacity: 0; pointer-events: none;
      transition: opacity 0.1s ease-out; z-index: 5;
    }
  </style>
</head>
<body>

  <div id="app">
    <div id="header">
      <div>Item: <span id="prod-label" class="badge">PROD_001</span></div>
      <div>Fotos: <span id="photo-count">0</span></div>
      <button class="btn-reset" id="btn-reset">Zerar</button>
      <span class="version-tag">v1.4 - Direct</span>
    </div>
    <div id="status-bar">Iniciando câmera...</div>

    <div id="camera-container">
      <video id="video" autoplay playsinline webkit-playsinline muted></video>
      <div id="flash"></div>
      <canvas id="canvas" style="display:none;"></canvas>
    </div>

    <div id="controls">
      <button class="btn btn-photo" id="btn-photo">
        📷 FOTOGRAFAR (A)
        <span class="subtext">Salva no Drive</span>
      </button>

      <button class="btn btn-next" id="btn-next">
        ➡️ PRÓXIMO (B)
        <span class="subtext">Mudar Produto</span>
      </button>
    </div>
  </div>

  <!-- Form e Iframe invisíveis para envio nativo sem bloqueio de rede do navegador -->
  <iframe name="hidden_upload_frame" id="hidden_upload_frame" style="display:none;"></iframe>
  <form id="upload-form" method="POST" target="hidden_upload_frame" style="display:none;">
    <input type="hidden" name="prodId" id="f-prodId">
    <input type="hidden" name="filename" id="f-filename">
    <input type="hidden" name="image" id="f-image">
  </form>

  <script>
    // =========================================================================
    // COLE SUA URL DO APPS SCRIPT AQUI ENTRE AS ASPAS:
    // =========================================================================
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxYjjsSAyiQQZURU5RiOz0NN17392cq7exjUvg3OLObHehg8yOIRavZwRnpHmmdxvM4_A/exec";

    let currentProdIndex = parseInt(localStorage.getItem('savedProdIndex')) || 1;
    let currentPhotoIndex = parseInt(localStorage.getItem('savedPhotoIndex')) || 1;

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const flash = document.getElementById('flash');
    const prodLabel = document.getElementById('prod-label');
    const photoCountLabel = document.getElementById('photo-count');
    const statusBar = document.getElementById('status-bar');
    const uploadForm = document.getElementById('upload-form');
    uploadForm.action = SCRIPT_URL;

    function updateDisplay() {
      prodLabel.innerText = 'PROD_' + String(currentProdIndex).padStart(3, '0');
      photoCountLabel.innerText = currentPhotoIndex - 1;
    }

    async function startCamera() {
      statusBar.innerText = "Conectando à câmera...";
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: "environment" } },
          audio: false
        });
        video.srcObject = stream;
        video.onloadedmetadata = async () => {
          try {
            await video.play();
            statusBar.style.color = "#4caf50";
            statusBar.innerText = "Câmera pronta";
          } catch (e) {
            document.body.addEventListener('click', () => video.play(), { once: true });
          }
        };
      } catch (err) {
        statusBar.style.color = "#f44336";
        statusBar.innerText = "Erro câmera: " + err.message;
      }
    }

    function triggerFlash() {
      flash.style.opacity = '0.7';
      setTimeout(() => { flash.style.opacity = '0'; }, 100);
      if (navigator.vibrate) navigator.vibrate(40);
    }

    function sendNativeForm(base64Data, prodId, filename) {
      statusBar.style.color = "#ffeb3b";
      statusBar.innerText = `Gravando ${filename}...`;

      document.getElementById('f-prodId').value = prodId;
      document.getElementById('f-filename').value = filename;
      document.getElementById('f-image').value = base64Data;

      // O envio via formulário padrão é tratado pelo navegador como navegação,
      // contornando restrições de CORS e limites restritos do fetch.
      uploadForm.submit();

      setTimeout(() => {
        statusBar.style.color = "#4caf50";
        statusBar.innerText = `Enviado: ${filename}`;
      }, 1200);
    }

    document.getElementById('btn-photo').addEventListener('click', () => {
      if (!video.videoWidth || !video.videoHeight) {
        alert("Aguarde a câmera iniciar.");
        return;
      }

      triggerFlash();

      // Reduz a imagem para ~1024px para envio instantâneo e leve
      const maxWidth = 1024;
      let width = video.videoWidth;
      let height = video.videoHeight;

      if (width > maxWidth) {
        height = Math.round((height * maxWidth) / width);
        width = maxWidth;
      }

      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, width, height);

      const prodId = 'PROD_' + String(currentProdIndex).padStart(3, '0');
      const filename = `${prodId}_FOTO_${currentPhotoIndex}.jpg`;
      const base64 = canvas.toDataURL('image/jpeg', 0.75);

      sendNativeForm(base64, prodId, filename);

      currentPhotoIndex++;
      localStorage.setItem('savedPhotoIndex', currentPhotoIndex);
      updateDisplay();
    });

    document.getElementById('btn-next').addEventListener('click', () => {
      if (currentPhotoIndex === 1) {
        if (!confirm("Nenhuma foto tirada deste item. Deseja avançar mesmo assim?")) return;
      }

      currentProdIndex++;
      currentPhotoIndex = 1;

      localStorage.setItem('savedProdIndex', currentProdIndex);
      localStorage.setItem('savedPhotoIndex', currentPhotoIndex);

      updateDisplay();
      statusBar.style.color = "#fff";
      statusBar.innerText = `Pronto para PROD_${String(currentProdIndex).padStart(3, '0')}`;

      if (navigator.vibrate) navigator.vibrate([80, 50, 80]);
    });

    document.getElementById('btn-reset').addEventListener('click', () => {
      if (confirm("Zerar lote e voltar ao PROD_001?")) {
        currentProdIndex = 1;
        currentPhotoIndex = 1;
        localStorage.removeItem('savedProdIndex');
        localStorage.removeItem('savedPhotoIndex');
        updateDisplay();
        statusBar.innerText = "Reiniciado para PROD_001";
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      updateDisplay();
      startCamera();
    });
  </script>
</body>
</html>
