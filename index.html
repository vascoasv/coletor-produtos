<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Coletor de Lote</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    html, body {
      width: 100%;
      height: 100%;
      background-color: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100dvh; /* Garante tamanho exato descontando barras do Chrome no celular */
      width: 100%;
      position: relative;
    }

    #header {
      padding: 10px 16px;
      background: rgba(20, 20, 20, 0.9);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      z-index: 10;
      border-bottom: 1px solid #333;
    }

    .badge {
      background: #2e7d32;
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: bold;
    }

    #camera-container {
      flex: 1;
      position: relative;
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 12px calc(14px + env(safe-area-inset-bottom));
      background: #181818;
      gap: 12px;
      z-index: 10;
      border-top: 1px solid #2a2a2a;
    }

    .btn {
      flex: 1;
      min-height: 60px;
      border-radius: 12px;
      border: none;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
    }

    .btn-photo {
      background: #0288d1;
      color: white;
    }

    .btn-photo:active {
      background: #0277bd;
    }

    .btn-next {
      background: #f57c00;
      color: white;
    }

    .btn-next:active {
      background: #e65100;
    }

    .subtext {
      font-size: 11px;
      margin-top: 3px;
      opacity: 0.85;
      font-weight: normal;
    }

    #flash {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: white;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.1s ease-out;
      z-index: 5;
    }
  </style>
</head>
<body>

  <div id="app">
    <div id="header">
      <div>Produto: <span id="prod-label" class="badge">PROD_001</span></div>
      <div>Fotos: <span id="photo-count">0</span></div>
    </div>

    <div id="camera-container">
      <video id="video" autoplay playsinline muted></video>
      <div id="flash"></div>
      <canvas id="canvas" style="display:none;"></canvas>
    </div>

    <div id="controls">
      <button class="btn btn-photo" id="btn-photo">
        📷 FOTOGRAFAR (A)
        <span class="subtext">Etiqueta / Peça</span>
      </button>

      <button class="btn btn-next" id="btn-next">
        ➡️ PRÓXIMO (B)
        <span class="subtext">Mudar Produto</span>
      </button>
    </div>
  </div>

  <script>
    let currentProdIndex = 1;
    let currentPhotoIndex = 1;
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const flash = document.getElementById('flash');
    const prodLabel = document.getElementById('prod-label');
    const photoCountLabel = document.getElementById('photo-count');

    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: "environment" },
            width: { ideal: 1920 },
            height: { ideal: 1080 }
          },
          audio: false
        });
        video.srcObject = stream;
      } catch (err) {
        alert("Acesso à câmera não liberado ou erro: " + err.message);
      }
    }

    function triggerFlash() {
      flash.style.opacity = '0.7';
      setTimeout(() => { flash.style.opacity = '0'; }, 120);
      if (navigator.vibrate) navigator.vibrate(40);
    }

    function getFormattedProdId(num) {
      return 'PROD_' + String(num).padStart(3, '0');
    }

    document.getElementById('btn-photo').addEventListener('click', () => {
      triggerFlash();

      canvas.width = video.videoWidth || 1280;
      canvas.height = video.videoHeight || 720;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const prodId = getFormattedProdId(currentProdIndex);
      const filename = `${prodId}_FOTO_${currentPhotoIndex}.jpg`;

      canvas.toBlob((blob) => {
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = filename;
        link.click();
        URL.revokeObjectURL(link.href);
      }, 'image/jpeg', 0.9);

      currentPhotoIndex++;
      photoCountLabel.innerText = currentPhotoIndex - 1;
    });

    document.getElementById('btn-next').addEventListener('click', () => {
      if (currentPhotoIndex === 1) {
        if (!confirm("Ainda não tirou fotos deste produto. Avançar mesmo assim?")) {
          return;
        }
      }

      currentProdIndex++;
      currentPhotoIndex = 1;
      
      prodLabel.innerText = getFormattedProdId(currentProdIndex);
      photoCountLabel.innerText = "0";

      if (navigator.vibrate) navigator.vibrate([80, 50, 80]);
    });

    window.addEventListener('DOMContentLoaded', startCamera);
  </script>
</body>
</html>
